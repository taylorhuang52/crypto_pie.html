<style>
  @import url('https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tc@5.0.0/index.css');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #0d0d0d;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    padding: 30px 0 20px;
  }

  .header h1 {
    font-size: 32px;
    color: #f0b90b;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .header .subtitle {
    font-size: 14px;
    color: #888;
  }

  .steps {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 30px 0;
    flex-wrap: wrap;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: #1a1a2e;
    border: 1px solid #2a2a3e;
    border-radius: 20px;
    font-size: 13px;
    color: #888;
    transition: all 0.3s;
  }

  .step.active {
    background: #f0b90b;
    color: #000;
    border-color: #f0b90b;
    font-weight: 600;
  }

  .step.done {
    background: #2ed573;
    color: #000;
    border-color: #2ed573;
  }

  .step-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }

  .step.active .step-num { background: rgba(0,0,0,0.2); }
  .step.done .step-num { background: rgba(0,0,0,0.2); }

  .upload-section {
    background: #1a1a2e;
    border: 2px dashed #2a2a3e;
    border-radius: 20px;
    padding: 60px 40px;
    text-align: center;
    margin-bottom: 30px;
    transition: all 0.3s;
    cursor: pointer;
  }

  .upload-section:hover, .upload-section.dragover {
    border-color: #f0b90b;
    background: #1f1f35;
  }

  .upload-icon {
    font-size: 64px;
    margin-bottom: 16px;
  }

  .upload-title {
    font-size: 20px;
    color: #fff;
    margin-bottom: 8px;
  }

  .upload-desc {
    font-size: 14px;
    color: #888;
    margin-bottom: 20px;
  }

  .upload-btn {
    padding: 12px 28px;
    background: #f0b90b;
    color: #000;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
  }

  .upload-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(240, 185, 11, 0.3);
  }

  .upload-btn.secondary {
    background: transparent;
    border: 1px solid #f0b90b;
    color: #f0b90b;
    margin-left: 10px;
  }

  .preview-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 30px;
  }

  @media (max-width: 900px) {
    .preview-section { grid-template-columns: 1fr; }
  }

  .preview-card {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #2a2a3e;
  }

  .preview-card h3 {
    font-size: 16px;
    color: #f0b90b;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .preview-img {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 10px;
    background: #0d0d0d;
  }

  .ocr-text {
    background: #0d0d0d;
    border-radius: 10px;
    padding: 16px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #aaa;
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
  }

  .ocr-text::-webkit-scrollbar { width: 6px; }
  .ocr-text::-webkit-scrollbar-track { background: #0d0d0d; }
  .ocr-text::-webkit-scrollbar-thumb { background: #f0b90b; border-radius: 3px; }

  .progress-bar {
    width: 100%;
    height: 8px;
    background: #2a2a3e;
    border-radius: 4px;
    overflow: hidden;
    margin: 16px 0;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #f0b90b, #ff6b6b);
    border-radius: 4px;
    transition: width 0.3s;
    width: 0%;
  }

  .progress-text {
    font-size: 13px;
    color: #888;
    text-align: center;
  }

  .data-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 30px;
  }

  @media (max-width: 900px) {
    .data-section { grid-template-columns: 1fr; }
  }

  .data-card {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid #2a2a3e;
  }

  .data-card h3 {
    font-size: 18px;
    color: #f0b90b;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .data-table th {
    background: #252540;
    color: #f0b90b;
    padding: 10px 8px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
  }

  .data-table td {
    padding: 8px;
    border-bottom: 1px solid #2a2a3e;
    color: #ccc;
  }

  .data-table input {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #2a2a3e;
    color: #fff;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
  }

  .data-table input:focus {
    outline: none;
    border-color: #f0b90b;
  }

  .data-table input.name-input { min-width: 120px; }
  .data-table input.qty-input { width: 90px; }
  .data-table input.val-input { width: 100px; }

  .delete-btn {
    background: transparent;
    border: none;
    color: #ff4757;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .delete-btn:hover {
    background: rgba(255, 71, 87, 0.1);
  }

  .add-row-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px dashed #2a2a3e;
    color: #888;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    margin-top: 12px;
    transition: all 0.2s;
  }

  .add-row-btn:hover {
    border-color: #f0b90b;
    color: #f0b90b;
  }

  .chart-container {
    position: relative;
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
  }

  .legend-container {
    max-height: 450px;
    overflow-y: auto;
    padding-right: 8px;
  }

  .legend-container::-webkit-scrollbar { width: 6px; }
  .legend-container::-webkit-scrollbar-track { background: #0d0d0d; }
  .legend-container::-webkit-scrollbar-thumb { background: #f0b90b; border-radius: 3px; }

  .legend-item {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
    background: #12121f;
    transition: all 0.2s;
    cursor: pointer;
    font-size: 12px;
  }

  .legend-item:hover {
    background: #252540;
    transform: translateX(3px);
  }

  .legend-color {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 10px;
    flex-shrink: 0;
  }

  .legend-name {
    flex: 1;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .legend-value {
    font-weight: 600;
    color: #fff;
    margin-right: 8px;
    white-space: nowrap;
  }

  .legend-pct {
    font-weight: 700;
    color: #f0b90b;
    min-width: 50px;
    text-align: right;
  }

  .total-display {
    text-align: center;
    padding: 16px;
    background: linear-gradient(135deg, #1a1a2e, #252540);
    border-radius: 12px;
    margin-bottom: 20px;
  }

  .total-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
  }

  .total-value {
    font-size: 28px;
    font-weight: 700;
    color: #f0b90b;
  }

  .action-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 20px 0;
    flex-wrap: wrap;
  }

  .action-btn {
    padding: 10px 20px;
    background: #1a1a2e;
    border: 1px solid #2a2a3e;
    color: #ccc;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .action-btn:hover {
    background: #252540;
    border-color: #f0b90b;
    color: #f0b90b;
  }

  .action-btn.primary {
    background: #f0b90b;
    color: #000;
    border-color: #f0b90b;
    font-weight: 600;
  }

  .action-btn.primary:hover {
    background: #ffc727;
  }

  .hidden { display: none !important; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #2ed573;
    color: #000;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.error {
    background: #ff4757;
    color: #fff;
  }

  .section-title {
    font-size: 20px;
    color: #fff;
    margin: 30px 0 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #666;
  }

  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 12px;

<body>

<div class="container">
  <div class="header">
    <h1>📊 加密貨幣截圖解析器</h1>
    <div class="subtitle">上傳錢包截圖 → 自動解析 → 生成圓餅圖分析</div>
  </div>

  <div class="steps">
    <div class="step active" id="step1">
      <div class="step-num">1</div>
      <span>上傳截圖</span>
    </div>
    <div class="step" id="step2">
      <div class="step-num">2</div>
      <span>OCR 解析</span>
    </div>
    <div class="step" id="step3">
      <div class="step-num">3</div>
      <span>編輯資料</span>
    </div>
    <div class="step" id="step4">
      <div class="step-num">4</div>
      <span>查看圖表</span>
    </div>
  </div>

  <!-- 上傳區 -->
  <div id="uploadArea">
    <div class="upload-section" id="dropZone">
      <div class="upload-icon">📤</div>
      <div class="upload-title">拖放截圖至此處，或點擊上傳</div>
      <div class="upload-desc">支援 PNG、JPG、JPEG 格式（建議清晰截圖）</div>
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">選擇圖片</button>
      <button class="upload-btn secondary" onclick="loadDemoData()">載入範例資料</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(event)">
    </div>
  </div>

  <!-- 預覽區 -->
  <div id="previewArea" class="hidden">
    <div class="preview-section">
      <div class="preview-card">
        <h3>📷 上傳截圖</h3>
        <img id="previewImg" class="preview-img" src="" alt="preview">
      </div>
      <div class="preview-card">
        <h3>🔍 OCR 解析結果</h3>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">準備中...</div>
        <div class="ocr-text" id="ocrText">等待解析...</div>
      </div>
    </div>

    <div class="action-bar">
      <button class="action-btn" onclick="resetUpload()">🔄 重新上傳</button>
      <button class="action-btn primary" onclick="goToEdit()">✏️ 編輯解析資料</button>
    </div>
  </div>

  <!-- 編輯區 -->
  <div id="editArea" class="hidden">
    <h2 class="section-title">️ 編輯資產資料</h2>
    <div class="data-section">
      <div class="data-card">
        <h3>
          <span>📋 資產明細</span>
          <span style="font-size:12px;color:#888" id="assetCount">0 項</span>
        </h3>
        <table class="data-table">
          <thead>
            <tr>
              <th>名稱</th>
              <th>符號</th>
              <th>數量</th>
              <th>價值 (US$)</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="editTableBody"></tbody>
        </table>
        <button class="add-row-btn" onclick="addRow()">+ 新增資產</button>
      </div>

      <div class="data-card">
        <h3>📊 即時預覽</h3>
        <div class="total-display">
          <div class="total-label">總資產價值</div>
          <div class="total-value" id="totalValue">$0.00</div>
        </div>
        <div class="chart-container">
          <canvas id="previewChart"></canvas>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="action-btn" onclick="backToUpload()">⬅️ 返回上傳</button>
      <button class="action-btn" onclick="clearAllData()">️ 清空資料</button>
      <button class="action-btn primary" onclick="goToChart()">📊 查看完整圖表</button>
    </div>
  </div>

  <!-- 圖表區 -->
  <div id="chartArea" class="hidden">
    <h2 class="section-title"> 資產分佈分析</h2>
    <div class="data-section">
      <div class="data-card">
        <h3>🥧 資產佔比圓餅圖</h3>
        <div class="total-display">
          <div class="total-label">總資產價值</div>
          <div class="total-value" id="chartTotalValue">$0.00</div>
        </div>
        <div class="chart-container">
          <canvas id="finalChart"></canvas>
        </div>
      </div>
      <div class="data-card">
        <h3>📋 資產明細</h3>
        <div class="legend-container" id="finalLegend"></div>
      </div>
    </div>

    <div class="action-bar">
      <button class="action-btn" onclick="backToEdit()">⬅️ 返回編輯</button>
      <button class="action-btn" onclick="exportData()">💾 匯出 JSON</button>
      <button class="action-btn primary" onclick="resetAll()">🔄 重新開始</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toast.className = 'toast', 2500);
}

function setStep(n) {
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('step' + i);
    el.className = 'step';
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  }
}

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFileObj(e.dataTransfer.files[0]);
});
dropZone.addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') document.getElementById('fileInput').click();
});

function handleFile(e) {
  if (e.target.files.length) handleFileObj(e.target.files[0]);
}

function handleFileObj(file) {
  if (!file.type.startsWith('image/')) {
    showToast('請上傳圖片檔案', true);
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('previewImg').src = e.target.result;
    document.getElementById('uploadArea').classList.add('hidden');
    document.getElementById('previewArea').classList.remove('hidden');
    setStep(2);
    runOCR(e.target.result);
  };
  reader.readAsDataURL(file);
}

async function runOCR(imgSrc) {
  const ocrText = document.getElementById('ocrText');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');

  ocrText.textContent = '正在初始化 OCR 引擎...';
  progressFill.style.width = '0%';

  try {
    const result = await Tesseract.recognize(imgSrc, 'eng+chi_tra', {
      logger: (m) => {
        if (m.status === 'recognizing text') {
          const pct = Math.round(m.progress * 100);
          progressFill.style.width = pct + '%';
          progressText.textContent = `解析中... ${pct}%`;
        } else {
          progressText.textContent = m.status;
        }
      }
    });

    ocrText.textContent = result.data.text;
    progressFill.style.width = '100%';
    progressText.textContent = '解析完成！';

    // 嘗試從 OCR 結果解析資產
    const parsed = parseOCRText(result.data.text);
    if (parsed.length > 0) {
      assets = parsed;
      showToast(`成功解析 ${parsed.length} 項資產`);
    } else {
      showToast('未能自動解析，請手動編輯', true);
      assets = [];
    }
  } catch (err) {
    ocrText.textContent = '解析失敗: ' + err.message;
    progressText.textContent = '解析失敗';
    showToast('OCR 解析失敗', true);
  }
}

function parseOCRText(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const parsed = [];

  // 嘗試匹配各種格式：名稱 代幣符號 價值 數量
  // 常見模式：Name US$XXX.XX qty SYMBOL
  for (const line of lines) {
    // 匹配 US$ 數字模式
    const usdMatch = line.match(/US\$?\s*([\d,]+\.?\d*)/);
    if (!usdMatch) continue;

    const value = parseFloat(usdMatch[1].replace(/,/g, ''));
    if (isNaN(value) || value <= 0) continue;

    // 嘗試提取名稱和符號
    const parts = line.split(/\s+/);
    let name = '';
    let symbol = '';
    let qty = 0;

    // 尋找大寫字母組合（可能是符號）
    const symbolMatch = line.match(/\b([A-Z]{2,8})\b/);
    if (symbolMatch) symbol = symbolMatch[1];

    // 尋找小數點數字（可能是數量）
    const qtyMatch = line.match(/\b(\d+\.\d{4,})\b/);
    if (qtyMatch) qty = parseFloat(qtyMatch[1]);

    // 名稱取 US$ 前面的文字
    const namePart = line.substring(0, line.indexOf('US$')).trim();
    if (namePart) name = namePart;

    if (name || symbol) {
      parsed.push({
        name: name || symbol,
        symbol: symbol || '???',
        qty: qty || 0,
        value: value
      });
    }
  }

  return parsed;
}

  assets = JSON.parse(JSON.stringify(demoAssets));
  document.getElementById('uploadArea').classList.add('hidden');
  document.getElementById('previewArea').classList.add('hidden');
  document.getElementById('editArea').classList.remove('hidden');

}

function resetUpload() {
  document.getElementById('uploadArea').classList.remove('hidden');
  document.getElementById('previewArea').classList.add('hidden');
  document.getElementById('fileInput').value = '';
  setStep(1);
}

function goToEdit() {
  document.getElementById('previewArea').classList.add('hidden');
  document.getElementById('editArea').classList.remove('hidden');
  setStep(3);
  renderEditTable();
  updatePreviewChart();
}

function backToUpload() {
  document.getElementById('editArea').classList.add('hidden');
  document.getElementById('uploadArea').classList.remove('hidden');
  setStep(1);
}

function goToChart() {
  collectEditData();
  if (assets.length === 0) {
    showToast('請至少新增一項資產', true);

  }
  document.getElementById('editArea').classList.add('hidden');

  assets = [];
  document.getElementById('chartArea').classList.add('hidden');
  document.getElementById('editArea').classList.add('hidden');
  document.getElementById('previewArea').classList.add('hidden');
  document.getElementById('uploadArea').classList.remove('hidden');
  document.getElementById('fileInput').value = '';
  setStep(1);
}

function clearAllData() {
  if (confirm('確定要清空所有資料嗎？')) {
    assets = [];
    renderEditTable();
    updatePreviewChart();
    showToast('已清空資料');
  }
}

function renderEditTable() {
  const tbody = document.getElementById('editTableBody');
  tbody.innerHTML = '';
  document.getElementById('assetCount').textContent = assets.length + ' 項';

  assets.forEach((asset, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input class="name-input" value="${asset.name}" data-idx="${i}" data-field="name"></td>
      <td><input class="qty-input" value="${asset.symbol}" data-idx="${i}" data-field="symbol" style="width:70px"></td>
      <td><input class="qty-input" type="number" step="0.0000001" value="${asset.qty}" data-idx="${i}" data-field="qty"></td>
      <td><input class="val-input" type="number" step="0.01" value="${asset.value}" data-idx="${i}" data-field="value"></td>
      <td><button class="delete-btn" onclick="deleteRow(${i})">✕</button></td>
    `;
    tbody.appendChild(tr);
  });

  // 綁定輸入事件
  tbody.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = parseInt(e.target.dataset.idx);
      const field = e.target.dataset.field;
      let val = e.target.value;
      if (field === 'qty' || field === 'value') val = parseFloat(val) || 0;
      assets[idx][field] = val;
      updatePreviewChart();
    });
  });
}

function addRow() {
  assets.push({ name: '新資產', symbol: 'NEW', qty: 0, value: 0 });
  renderEditTable();
  updatePreviewChart();
}

function deleteRow(idx) {
  assets.splice(idx, 1);
  renderEditTable();
  updatePreviewChart();
}

function collectEditData() {
  // 資料已在 input 事件中即時更新
}

function getTotalValue() {
  return assets.reduce((s, a) => s + (parseFloat(a.value) || 0), 0);
}

function updatePreviewChart() {
  const total = getTotalValue();
  document.getElementById('totalValue').textContent = '$' + total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  document.getElementById('assetCount').textContent = assets.length + ' 項';

  const validAssets = assets.filter(a => a.value > 0);
  const ctx = document.getElementById('previewChart').getContext('2d');

  if (previewChart) previewChart.destroy();

  if (validAssets.length === 0) {
    previewChart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: ['無資料'], datasets: [{ data: [1], backgroundColor: ['#2a2a3e'] }] },
      options: { responsive: true, plugins: { legend: { display: false }, datalabels: { display: false } } }
    });
    return;
  }

  previewChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: validAssets.map(a => a.name),
      datasets: [{
        data: validAssets.map(a => a.value),
        backgroundColor: colors.slice(0, validAssets.length),
        borderColor: '#0d0d0d',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      cutout: '45%',
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1a2e',
          titleColor: '#f0b90b',
          bodyColor: '#fff',
          borderColor: '#f0b90b',
          borderWidth: 1,
          callbacks: {
            label: (ctx) => {
              const pct = ((ctx.parsed / total) * 100).toFixed(2);
              return ` ${ctx.label}: ${pct}%`;
            }
          }
        },
        datalabels: {
          display: validAssets.length <= 12,
          color: '#fff',
          font: { size: 10, weight: 'bold' },
          formatter: (v) => {
            const pct = (v / total) * 100;
            return pct > 3 ? pct.toFixed(1) + '%' : '';
          }
        }
      }
    },
    plugins: [ChartDataLabels]
  });
}

function renderFinalChart() {
  const total = getTotalValue();
  document.getElementById('chartTotalValue').textContent = '$' + total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

  const validAssets = [...assets].filter(a => a.value > 0).sort((a, b) => b.value - a.value);
  const ctx = document.getElementById('finalChart').getContext('2d');

  if (finalChart) finalChart.destroy();

  finalChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: validAssets.map(a => a.name),
      datasets: [{
        data: validAssets.map(a => a.value),
        backgroundColor: colors.slice(0, validAssets.length),
        borderColor: '#0d0d0d',
        borderWidth: 2,
        hoverOffset: 12
      }]
    },
    options: {
      responsive: true,
      cutout: '40%',
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1a2e',
          titleColor: '#f0b90b',
          bodyColor: '#fff',
          borderColor: '#f0b90b',
          borderWidth: 1,
          cornerRadius: 8,
          padding: 12,
          callbacks: {
            label: (ctx) => {
              const pct = ((ctx.parsed / total) * 100).toFixed(2);
              return ` ${ctx.label}: $${ctx.parsed.toLocaleString('en-US', {minimumFractionDigits: 2})} (${pct}%)`;
            }
          }
        },
        datalabels: {
          display: validAssets.length <= 15,
          color: '#fff',
          font: { size: 11, weight: 'bold' },
          formatter: (v) => {
            const pct = (v / total) * 100;
            return pct > 2 ? pct.toFixed(1) + '%' : '';
          }
        }
      },
      animation: { animateRotate: true, duration: 1200 }
    },
    plugins: [ChartDataLabels]
  });
}

function renderFinalLegend() {
  const total = getTotalValue();
  const validAssets = [...assets].filter(a => a.value > 0).sort((a, b) => b.value - a.value);
  const container = document.getElementById('finalLegend');
  container.innerHTML = '';

  validAssets.forEach((asset, i) => {
    const pct = ((asset.value / total) * 100).toFixed(2);
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `
      <div class="legend-color" style="background:${colors[i % colors.length]}"></div>
      <div class="legend-name">${asset.name}</div>
      <div class="legend-value">$${asset.value.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
      <div class="legend-pct">${pct}%</div>
    `;
    item.addEventListener('mouseenter', () => {
      if (finalChart) {
        finalChart.setActiveElements([{ datasetIndex: 0, index: i }]);
        finalChart.update();
      }
    });
    item.addEventListener('mouseleave', () => {
      if (finalChart) {
        finalChart.setActiveElements([]);
        finalChart.update();
      }
    });
    container.appendChild(item);
  });
}

function exportData() {
  const total = getTotalValue();
  const data = {
    totalValue: total,
    assets: assets.map(a => ({
      ...a,
      percentage: ((a.value / total) * 100).toFixed(2) + '%'
    }))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'crypto-assets.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出 JSON 檔案');
}
