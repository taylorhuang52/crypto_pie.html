<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冷錢包持倉市值分析</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16202a;--muted:#667380;--line:#e1e5ea;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--card:#18202a;--text:#e8edf2;--muted:#93a0ad;--line:#2a3541;--acc:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
h2{font-size:1.15rem;margin:0 0 4px}
.wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;margin-top:12px}
.chart{flex:1 1 320px;max-width:420px;margin:0 auto;position:relative}
svg{width:100%;height:auto;display:block}
svg path{stroke:var(--card);stroke-width:1.5;cursor:pointer;transition:opacity .15s}
svg path:hover{opacity:.8}
.tip{position:absolute;pointer-events:none;background:#000d;color:#fff;font-size:.8rem;padding:6px 9px;border-radius:6px;display:none;white-space:nowrap;z-index:5}
.legend{flex:1 1 320px;min-width:0}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px}
.small{color:var(--muted);font-size:.82rem}
.members{color:var(--muted);font-size:.76rem;display:block;margin-left:17px}
.note{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>冷錢包持倉市值分析</h1>
<p class="sub" id="summary"></p>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="view"></div>
<p class="note">數據由截圖人工讀取，錢包一解析度有限，個別數字可能有小誤差；單位為美元（US$）。</p>
</main>

<script>
// [顯示名稱, 市值USD, 歸類]
const W1=[
["GOOGLon",220.95,"Alphabet"],["Alphabet",212.09,"Alphabet"],["Alphabet xStock",662.27,"Alphabet"],
["Amazon",996.41,"Amazon"],["Amazon.com xStock",31.55,"Amazon"],
["Advanced Micro Devices",1814.93,"AMD"],["AMDon",213.50,"AMD"],
["Apple",883.88,"Apple"],["AAPLon",198.80,"Apple"],["Apple xStock",54.26,"Apple"],
["Binance Smart Chain",29.65,"BNB"],["Binance Staked SOL",292.36,"Solana (SOL)"],
["Broadcom",1428.17,"Broadcom"],["AVGOon",200.32,"Broadcom"],
["BTC Taproot",8648.66,"比特幣 (BTC)"],
["COSTon",210.01,"Costco"],["Dell",583.25,"Dell"],
["Ethereum",0.17,"以太幣 (ETH)"],["IONQon",133.37,"IonQ"],
["Intel Corporation",779.55,"Intel"],["INTCon",89.09,"Intel"],
["Invesco QQQ",1072.90,"納斯達克100 (QQQ)"],
["Lombard Staked BTC",1931.66,"比特幣 (BTC)"],
["Marvell Technology",550.70,"Marvell"],
["Meta Platforms",384.41,"Meta"],["Meta xStock",13.75,"Meta"],
["Micron Technology",749.11,"Micron"],["MUon",46.85,"Micron"],
["Microsoft",274.21,"Microsoft"],["Microsoft xStock",82.92,"Microsoft"],
["Nasdaq xStock",238.45,"納斯達克100 (QQQ)"],
["NVIDIA Corp",765.34,"NVIDIA"],["NVDAon",39.17,"NVIDIA"],["NVIDIA xStock",554.04,"NVIDIA"],
["Palantir Technologies",385.91,"Palantir"],["PLTRon",159.55,"Palantir"],
["QQQon",192.82,"納斯達克100 (QQQ)"],["Qualcomm",114.67,"Qualcomm"],
["SLVon",37.89,"白銀 (SLV)"],["Solana",2.00,"Solana (SOL)"],
["SP500 xStock",441.05,"標普500 (SPY)"],
["SpaceX",858.76,"SpaceX"],["SPCXon",112.48,"SpaceX"],
["Sandisk Corporation",118.70,"Sandisk"],
["SPY",1011.49,"標普500 (SPY)"],["SPYon",155.77,"標普500 (SPY)"],
["TSMon",684.84,"台積電 (TSMC)"],["TSMC",1345.17,"台積電 (TSMC)"],
["Tesla, Inc.",1473.94,"Tesla"],["TSLAon",48.83,"Tesla"],["Tesla xStock",478.03,"Tesla"],
["VTIon",198.54,"VTI"],
["Wrapped Beacon ETH",1833.16,"以太幣 (ETH)"]
];
const W2=[
["Ethereum",87.33,"以太幣 (ETH)"],
["Gold xStock",224.06,"黃金 ETF (GLD)"],
["SLVon",685.11,"白銀 (SLV)"],
["Lombard Staked BTC",1077.02,"比特幣 (BTC)"],
["Paxos Gold (PAXG)",9203.34,"實體黃金代幣 PAXG"],
["Solana",4.21,"Solana (SOL)"],
["GLDon",367.99,"黃金 ETF (GLD)"],
["Tether Gold (XAUt)",16468.56,"實體黃金代幣 XAUt"]
];
const W3=[
["BNB Smart Chain (BNB)",635.44,"BNB"],
["Wrapped Beacon ETH (BSC)",20.33,"以太幣 (ETH)"],
["Binance Bridged USDT",0.09,"USDT 穩定幣"],
["Solana",202.31,"Solana (SOL)"],
["Jito Staked SOL",77.26,"Solana (SOL)"],
["Binance Staked SOL",19.36,"Solana (SOL)"],
["Bitcoin",9.72,"比特幣 (BTC)"],
["Tether (Ethereum)",0.15,"USDT 穩定幣"],
["Ethereum",0.01,"以太幣 (ETH)"],
["Polygon (POL)",0.01,"Polygon (POL)"]
];
const tag=(d,s)=>d.map(r=>[r[0]+"（"+s+"）",r[1],r[2]]);
const WALLETS=[
 {key:"w1",name:"錢包一",shown:36760.97,data:W1},
 {key:"w2",name:"錢包二",shown:28155.25,data:W2},
 {key:"w3",name:"錢包三",shown:964.67,data:W3},
 {key:"all",name:"全部錢包合併",shown:36760.97+28155.25+964.67,data:[...tag(W1,"錢包一"),...tag(W2,"錢包二"),...tag(W3,"錢包三")]}
];
const PAL=["#2563eb","#f59e0b","#10b981","#ef4444","#8b5cf6","#06b6d4","#ec4899","#84cc16","#f97316","#14b8a6","#6366f1","#eab308","#d946ef","#22c55e","#0ea5e9","#f43f5e","#a3a3a3","#7c3aed","#059669","#b45309","#0891b2","#be185d","#65a30d","#9333ea","#475569"];
const fmt=n=>"US$ "+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function pie(box,leg,items,total,threshold){
  let main=items.filter(i=>i.v/total>=threshold).sort((a,b)=>b.v-a.v);
  const rest=items.filter(i=>i.v/total<threshold);
  if(rest.length)main.push({n:`其他（${rest.length} 項）`,v:rest.reduce((s,i)=>s+i.v,0),m:rest.map(i=>i.n).join("、"),other:true});
  main.forEach((d,i)=>d.c=d.other?"#9aa5b1":PAL[i%PAL.length]);
  const sum=main.reduce((s,d)=>s+d.v,0);
  const R=150,C=160;let a0=-Math.PI/2,paths="";
  main.forEach(d=>{
    const a=d.v/sum*Math.PI*2,a1=a0+a;
    const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);
    const T=`${d.n}｜${fmt(d.v)}｜${(d.v/total*100).toFixed(2)}%`;
    paths+=main.length===1
      ?`<circle cx="${C}" cy="${C}" r="${R}" fill="${d.c}"/>`
      :`<path d="M${C},${C}L${x0},${y0}A${R},${R} 0 ${a>Math.PI?1:0} 1 ${x1},${y1}Z" fill="${d.c}" data-t="${T}"></path>`;
    a0=a1;
  });
  box.innerHTML=`<svg viewBox="0 0 320 320" role="img" aria-label="圓餅圖">${paths}</svg><div class="tip"></div>`;
  const tip=box.querySelector(".tip");
  box.querySelectorAll("path").forEach(p=>{
    p.addEventListener("mousemove",e=>{const r=box.getBoundingClientRect();tip.style.display="block";tip.textContent=p.dataset.t.replaceAll("｜"," ｜ ");tip.style.left=(e.clientX-r.left+12)+"px";tip.style.top=(e.clientY-r.top+12)+"px";});
    p.addEventListener("mouseleave",()=>tip.style.display="none");
    p.addEventListener("click",()=>alert(p.dataset.t.replaceAll("｜","\n")));
  });
  const rows=main.map(d=>`<tr><td><span class="dot" style="background:${d.c}"></span>${d.n}${d.m?`<span class="members">${d.m}</span>`:""}</td><td>${fmt(d.v)}</td><td>${(d.v/total*100).toFixed(2)}%</td></tr>`).join("");
  leg.innerHTML=`<table><thead><tr><th>名稱</th><th>市值</th><th>占比</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function render(w){
  const total=w.data.reduce((s,r)=>s+r[1],0);
  const diff=w.shown-total;
  document.getElementById("summary").textContent=
    `${w.name}：${w.data.length} 個代幣，加總市值 ${fmt(total)}（截圖總資產 ${fmt(w.shown)}，差額 ${fmt(Math.abs(diff))} 為截圖未顯示的項目或讀取誤差）`;
  const g={};
  w.data.forEach(r=>{(g[r[2]]=g[r[2]]||{n:r[2],v:0,l:[]});g[r[2]].v+=r[1];g[r[2]].l.push(r[0]);});
  const groups=Object.values(g).map(o=>({n:o.n,v:o.v,m:o.l.length>1?o.l.join("、"):""}));
  const gold=(g["黃金 ETF (GLD)"]?.v||0)+(g["實體黃金代幣 PAXG"]?.v||0)+(g["實體黃金代幣 XAUt"]?.v||0);
  const goldNote=gold?`<div class="small">黃金相關（GLD ETF 代幣＋PAXG＋XAUt）合計 ${fmt(gold)}，占 ${(gold/total*100).toFixed(2)}%。</div>`:"";
  const v=document.getElementById("view");
  v.innerHTML=`
  <section><h2>圖一：各代幣市值占比</h2>
   <div class="small">依個別代幣市值繪製；占比小於 1% 者合併為「其他」。</div>
   <div class="wrap"><div class="chart" id="c1"></div><div class="legend" id="l1"></div></div></section>
  <section><h2>圖二：依相同標的歸類後的市值占比</h2>
   <div class="small">同一股票／資產的不同代幣合併計算；BTC 類、ETH 類、SOL 類、QQQ 類、SPY 類、GLD 類各自歸為一類，PAXG 與 XAUt 為實體黃金代幣，各自獨立。</div>
   ${goldNote}
   <div class="wrap"><div class="chart" id="c2"></div><div class="legend" id="l2"></div></div></section>`;
  pie(document.getElementById("c1"),document.getElementById("l1"),w.data.map(r=>({n:r[0],v:r[1]})),total,0.01);
  pie(document.getElementById("c2"),document.getElementById("l2"),groups,total,0.01);
}

const tabs=document.getElementById("tabs");
WALLETS.forEach((w,i)=>{
  const b=document.createElement("button");
  b.role="tab";b.textContent=w.name;b.setAttribute("aria-selected",i===0);
  b.onclick=()=>{tabs.querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x===b));render(w);};
  tabs.appendChild(b);
});
render(WALLETS[0]);
</script>
</body>
</html>
